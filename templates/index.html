<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Target Tracking Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>



    <main class="container">
        <header class="header">
            <div class="header-content">
                <h1>AI Target Tracking</h1>
                <p>Real-time Computer Vision Analytics</p>
            </div>
            <a href="/gallery" class="nav-link glass-btn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Media Gallery
            </a>
        </header>

        <div class="dashboard-grid">
            <!-- Main Video Panel -->
            <div class="main-panel glass">
                <div class="video-container">
                    <div id="recording-badge" class="badge">
                        <div class="badge-dot"></div> Live Recording
                    </div>
                    <!-- Live MJPEG Stream from Flask -->
                    <img src="/video_feed" alt="Live Video Feed">
                </div>

                <div class="controls">

                    <button id="screenshot-btn" class="btn-primary action-btn" onclick="takeScreenshot()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>Capture Frame</span>
                    </button>
                    
                    <button id="record-btn" class="btn-danger action-btn" onclick="toggleRecording()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="record-text">Record</span>
                    </button>
                </div>
            </div>

            <!-- Side Analytics Panel -->
            <div class="side-panel glass">
                <h2>Real-Time Stats</h2>
                
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(14, 165, 233, 0.2); color: #38bdf8;">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <div class="stat-info">
                        <h3>Live FPS</h3>
                        <div id="stat-fps" class="stat-value">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">
                        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div class="stat-info">
                        <h3>Objects Tracked</h3>
                        <div id="stat-people" class="stat-value">0</div>
                    </div>
                </div>



            </div>
        </div>
    </main>

    <div id="toast" class="toast glass">Action Successful</div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function takeScreenshot() {
            try {
                const response = await fetch('/screenshot', { method: 'POST' });
                const data = await response.json();
                if(data.status === 'success') {
                    showToast('📸 Screenshot Saved!');
                }
            } catch (error) {
                console.error('Error taking screenshot:', error);
            }
        }

        async function toggleRecording() {
            try {
                const response = await fetch('/toggle_record', { method: 'POST' });
                const data = await response.json();
                const btn = document.getElementById('record-btn');
                const text = document.getElementById('record-text');
                const badge = document.getElementById('recording-badge');

                if (data.is_recording) {
                    btn.classList.add('recording');
                    text.textContent = 'Stop Recording';
                    badge.classList.add('visible');
                    showToast('🔴 Recording Started');
                } else {
                    btn.classList.remove('recording');
                    text.textContent = 'Record';
                    badge.classList.remove('visible');
                    showToast('✅ Video Saved to folder!');
                }
            } catch (error) {
                console.error('Error toggling record:', error);
            }
        }



        // Update stats
        setInterval(async () => {
            try {
                const response = await fetch('/stats');
                const data = await response.json();
                
                document.getElementById('stat-fps').textContent = data.fps;
                document.getElementById('stat-people').textContent = data.people_count;
            } catch(e) {}
        }, 500);
    </script>
</body>
</html>
